<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SEW web — 浏览器端拟合 PoC</title>
<style>
  body{font-family:"Segoe UI",system-ui,sans-serif;margin:18px;background:#f2f4f7;color:#1b2432}
  h1{font-size:16px;margin:0 0 4px}
  .sub{color:#6d7788;font-size:12px;margin-bottom:14px}
  .card{background:#fff;border:1px solid #e2e6ee;border-radius:10px;padding:12px 14px;
        box-shadow:0 2px 10px rgba(20,35,70,.06);margin-bottom:12px}
  label{font-size:12px;color:#6d7788;display:block;margin:8px 0 3px}
  input[type=file],input[type=text]{font:inherit;font-size:12px;padding:5px 7px;
        border:1px solid #e2e6ee;border-radius:6px;width:100%;box-sizing:border-box;background:#fbfcfe}
  button{font:inherit;font-size:12.5px;padding:7px 14px;border-radius:7px;border:1px solid #e2e6ee;
         background:#2f6fed;color:#fff;border:0;cursor:pointer;margin-top:10px}
  button:disabled{opacity:.5;cursor:not-allowed}
  #log{font-family:ui-monospace,Consolas,monospace;font-size:11px;background:#0f1726;color:#cfe0ff;
       border-radius:8px;padding:10px;height:190px;overflow:auto;white-space:pre-wrap}
  #out{max-width:100%;border:1px solid #e2e6ee;border-radius:8px;display:none;background:#fff}
  .row{display:flex;gap:12px;align-items:flex-start}
  .row > div{flex:1;min-width:0}
  #summary{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;white-space:pre-wrap}
  .tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:#eaf1ff;color:#2f6fed}
</style>
</head>
<body>
<h1>SEW web — 浏览器端拟合（实验页）</h1>
<div class="sub">
  所有计算都在你的浏览器里完成（Pyodide / WebAssembly），不上传任何数据。
  <span class="tag" id="state">初始化中…</span>
</div>

<div class="card">
  <label>观测谱（FITS，1D/2D/BINTABLE；cube 请先用「数据」页取谱）</label>
  <input id="fitsFile" type="file" accept=".fits,.fit,.fts"/>
  <label>星族模板（npz，含 templates/lam/ages/metals/fwhm）</label>
  <input id="tplFile" type="file" accept=".npz"/>
  <button id="runBtn" disabled>开始拟合</button>
</div>

<div class="card">
  <div class="row">
    <div>
      <div style="font-size:12px;color:#6d7788;margin-bottom:4px">日志</div>
      <div id="log"></div>
    </div>
    <div>
      <div style="font-size:12px;color:#6d7788;margin-bottom:4px">结果摘要</div>
      <div id="summary">—</div>
    </div>
  </div>
</div>

<div class="card">
  <img id="out" alt="fit plot"/>
</div>

<script src="poc.js"></script>
</body>
</html>
